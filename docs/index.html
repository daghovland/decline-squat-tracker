<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Decline Squat Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1976d2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Squat Tracker" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 24px;
    }

    #counter {
      font-size: 80px;
      font-weight: 700;
      line-height: 1;
      color: #1a1a1a;
      transition: color 0.3s;
    }

    #counter.done { color: #2e7d32; }

    #done-label {
      font-size: 20px;
      font-weight: 600;
      color: #2e7d32;
      margin-top: 8px;
      min-height: 28px;
    }

    .spacer { flex: 1; }

    #log-btn {
      width: 100%;
      height: 120px;
      font-size: 28px;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      background: #1976d2;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s;
      touch-action: manipulation;
    }

    #log-btn.done { background: #2e7d32; }
    #log-btn:active { opacity: 0.85; }

    #sets-section {
      width: 100%;
      margin-top: 32px;
    }

    #sets-label {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    #sets-list {
      list-style: none;
      font-size: 15px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="counter">0 / 6</div>
  <div id="done-label"></div>

  <div class="spacer"></div>

  <button id="log-btn">Log a set</button>

  <div id="sets-section" hidden>
    <p id="sets-label">Today's sets</p>
    <ul id="sets-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
